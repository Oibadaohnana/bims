# The workspace. Nothing is built from here directly — every crate is in
# `crates/`:
#
#   game        the room: the simulation and its wasm exports. A cdylib.
#   ship        the design phase and the game it starts. The other cdylib.
#   world       one system, the ship in it, and the clock they both run on.
#   flight      ship dynamics and the closed-form plan that flies a trip.
#   shipdesign  what a ship is made of and the rules for building one.
#   worldgen    the galaxy, systems and station blueprints. Client and server.
#   physics     ship mass, engine thrust and travel time. Pure arithmetic.
#   economy     money: whole euros and the crew's one shared pool.
#   health      one body: its health, what is wrong with it, and what that costs.
#   time        how long a minute, an hour and a day are. Defined once.
#
# The split is not tidiness. `worldgen` has to produce the same world on the
# wasm client and on the native server that will one day be authoritative,
# `physics` has to give the same answers to the world generator that it gives
# the designer and the flight step, `shipdesign` and `economy` have to admit
# the same ships and charge the same prices on both, and `world` and `flight`
# have to put the ship in the same place after the same number of steps. Two
# implementations of any of them would be two different games.
[workspace]
members = ["crates/*"]
resolver = "3"

# Profiles live here rather than in a member: cargo reads them from the
# workspace root only, and a `[profile]` in a member is silently ignored.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
