<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bims</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e7efe9;
        --muted: #8fa89a;
        --accent: #7fd1a8;
        --panel: #18211d;
        --edge: #2b3a32;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        background: #0c1210;
        color: var(--ink);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
        padding: 14px 20px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      header p {
        margin: 0;
        color: var(--muted);
      }

      main {
        flex: 1;
        min-height: 0;
        padding: 0 20px 20px;
      }

      #stage {
        display: block;
        cursor: crosshair;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        width: 100%;
        height: 100%;
        border: 1px solid #23352c;
        border-radius: 10px;
        background: #0c1210;
      }

      #clock {
        color: var(--accent);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      #speed-control {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        color: var(--muted);
        white-space: nowrap;
      }

      #speed-control input {
        width: 130px;
        accent-color: var(--accent);
      }

      #speed-value {
        min-width: 3ch;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      #menu {
        position: fixed;
        z-index: 10;
        min-width: 210px;
        padding: 5px;
        border: 1px solid var(--edge);
        border-radius: 9px;
        background: var(--panel);
        box-shadow: 0 12px 30px rgb(0 0 0 / 0.45);
      }

      #menu[hidden] {
        display: none;
      }

      #menu button {
        display: flex;
        flex-direction: column;
        gap: 1px;
        width: 100%;
        padding: 7px 10px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      #menu button:hover:not(:disabled),
      #menu button:focus-visible {
        background: #23372e;
        outline: none;
      }

      #menu button:disabled {
        color: var(--muted);
        cursor: default;
        opacity: 0.55;
      }

      #menu small {
        color: var(--muted);
        font-size: 12px;
      }

      #error:not(:empty) {
        margin: 12px 20px;
        padding: 10px 14px;
        border-radius: 8px;
        background: #3a1d1d;
        color: #ffd9d9;
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Bims</h1>
      <span id="clock">Day 1 · 08:00</span>
      <p id="status">
        Click a fixture for its menu · 1 or drag to select · right-click the
        floor to move
      </p>
      <label id="speed-control">
        <span>Speed</span>
        <input
          id="speed"
          type="range"
          min="1"
          max="12"
          step="1"
          value="1"
          aria-label="Simulation speed"
        />
        <output id="speed-value" for="speed">1x</output>
      </label>
    </header>
    <main><canvas id="stage"></canvas></main>
    <div id="menu" role="menu" hidden></div>
    <p id="error" role="alert"></p>
    <script>
      // A failure to even parse bims.js cannot be caught by bims.js, and
      // leaves nothing on screen but a black canvas. This is the only place
      // that can report it.
      window.addEventListener("error", (event) => {
        const box = document.getElementById("error");
        if (box && !box.textContent) {
          box.textContent = `Could not start Bims: ${event.message}`;
        }
      });

      // Dev convenience: a unique query per load means the browser cannot serve
      // a stale copy of the game back to you. The server sends no-store too,
      // but a cache poisoned before that was in place would outlive it.
      const build = Date.now();
      window.BIMS_BUILD = build;
      const tag = document.createElement("script");
      tag.src = `bims.js?v=${build}`;
      document.body.appendChild(tag);
    </script>
  </body>
</html>
