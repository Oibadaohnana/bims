# The workspace root. `bims` — the room, and the only cdylib — is still the
# package here; everything a future native server will also need lives in
# `crates/` beside it, so those parts compile for x86 as readily as for wasm.
[package]
name = "bims"
version = "0.1.0"
edition = "2024"
description = "Bims - a 2D top-down game that runs in the browser"

[lib]
crate-type = ["cdylib"]

[dependencies]
time = { path = "crates/time" }

[workspace]
members = ["crates/*"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
