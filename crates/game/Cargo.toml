# The room: the Bims, their needs and errands, the galley, the heads and the
# bay, and the drawing of all of it as a buffer of shapes. `crates/app` runs
# it on its own as the behaviour test room, and the ship game runs this very
# simulation **aboard the designed ship**: `world` builds a room from a
# `ShipDesign` through `aboard.rs` and steps it inside `World::step`. That
# is the one dependency this crate has on the rest of the workspace, and it
# is confined to that one module.
[package]
name = "bims"
version = "0.1.0"
edition = "2024"
description = "Bims — the room: the Bims' simulation, and the shapes it draws itself as"

[dependencies]
physics = { path = "../physics" }
shipdesign = { path = "../shipdesign" }
time = { path = "../time" }
